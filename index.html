<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YOLO 标注查看器</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 8V5.5A2.5 2.5 0 0 1 5.5 3H8M16 3h2.5A2.5 2.5 0 0 1 21 5.5V8M21 16v2.5a2.5 2.5 0 0 1-2.5 2.5H16M8 21H5.5A2.5 2.5 0 0 1 3 18.5V16" />
              <path d="M8 8h8v8H8z" />
            </svg>
          </div>
          <div class="brand-text">
            <strong id="brand-title">YOLO 标注查看器</strong>
            <span id="brand-subtitle">Annotation Viewer</span>
          </div>
        </div>

        <div class="toolbar">
          <button id="btn-open" class="btn btn-primary">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
            打开文件夹
          </button>
          <span class="divider"></span>
          <button id="btn-prev" class="btn btn-icon" title="上一张 (←)" aria-label="上一张">&#8249;</button>
          <span id="counter" class="counter">0 / 0</span>
          <button id="btn-next" class="btn btn-icon" title="下一张 (→)" aria-label="下一张">&#8250;</button>
          <span class="divider"></span>
          <button id="btn-zoom-out" class="btn btn-icon" title="缩小 (-)" aria-label="缩小">&#8722;</button>
          <span id="zoom-label" class="zoom-label">100%</span>
          <button id="btn-zoom-in" class="btn btn-icon" title="放大 (+)" aria-label="放大">+</button>
          <button id="btn-fit" class="btn">适应窗口</button>
          <span class="divider"></span>
          <button id="btn-toggle-labels" class="btn btn-toggle active" title="显示/隐藏类别标签">类别标签</button>
          <button id="btn-reveal" class="btn btn-icon" title="在资源管理器中显示" aria-label="在资源管理器中显示">&#8599;</button>
          <button id="btn-lang" class="btn" title="切换语言 / Switch language">EN</button>
        </div>
      </header>

      <div class="main">
        <aside class="panel sidebar">
          <div class="panel-head">
            <h3 id="panel-image-list">图片列表</h3>
            <span id="file-stats" class="muted"></span>
          </div>
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" /><path d="m20 20-4-4" /></svg>
            <input id="search" type="text" placeholder="搜索文件名..." autocomplete="off" />
          </div>
          <div id="scan-progress" class="scan-progress" hidden></div>
          <div id="image-list" class="image-list">
            <div id="list-spacer" class="list-spacer"></div>
            <div id="list-items" class="list-items"></div>
          </div>
        </aside>

        <main class="stage" id="stage">
          <canvas id="canvas"></canvas>
          <div id="empty" class="empty-state">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <path d="M8 13h8M12 9v8" />
              </svg>
            </div>
            <h2 id="empty-title">还没有打开数据集</h2>
            <p id="empty-hint">选择包含图片的文件夹，会自动读取同目录或 labels 子目录中的 YOLO 标注文件。</p>
            <button id="btn-open-empty" class="btn btn-primary btn-lg">选择文件夹</button>
          </div>
          <div id="zoom-badge" class="zoom-badge" hidden>100%</div>
          <div id="toast" class="toast" hidden></div>
        </main>

        <aside class="panel inspector">
          <section class="inspector-section">
            <div class="panel-head"><h3 id="panel-current-image">当前图片</h3></div>
            <div id="file-info" class="file-info empty-text">未选择图片</div>
          </section>
          <section class="inspector-section class-section">
            <div class="panel-head">
              <h3 id="panel-class-filter">类别筛选</h3>
              <div class="head-actions">
                <button id="btn-all-classes" class="link">全选</button>
                <button id="btn-no-classes" class="link">全不选</button>
              </div>
            </div>
            <div id="stats-hint" class="stats-hint" hidden></div>
            <div id="class-list" class="class-list empty-text">暂无类别</div>
          </section>
          <section class="inspector-section annotation-section">
            <div class="panel-head">
              <h3 id="panel-boxes">标注框</h3>
              <span id="box-count" class="muted"></span>
            </div>
            <div id="annotation-list" class="annotation-list empty-text">暂无标注</div>
          </section>
        </aside>
      </div>

      <footer class="statusbar">
        <span id="status-root">未打开文件夹</span>
        <span id="status-extra" class="status-extra"></span>
        <span class="spacer"></span>
        <span id="shortcuts" class="shortcuts">&#8592; &#8594; 切换图片 &nbsp;·&nbsp; 滚轮缩放 &nbsp;·&nbsp; 拖拽平移 &nbsp;·&nbsp; 单击选中标注框 &nbsp;·&nbsp; 0 适应窗口 &nbsp;·&nbsp; L 标签开关</span>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
